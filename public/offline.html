<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rabt HQ — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08090C; color: #fff; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .icon { width: 80px; height: 80px; background: rgba(1,151,166,0.15); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button { background: #0197a6; border: none; color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>Internet nahi hai</h1>
    <p>Rabt HQ ke liye internet connection chahiye.<br/>Connection restore hone pe dobara try karo.</p>
    <button onclick="window.location.reload()">Retry karo</button>
  </div>
</body>
</html>
